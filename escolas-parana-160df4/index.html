<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Painel de Projetos</title>
<style>body{margin:0;background:#050d18;color:#a9bacd;font-family:Poppins,system-ui,sans-serif;display:grid;place-items:center;height:100vh}</style>
</head><body><p id="m">Carregando o painel…</p>
<script>
fetch('conteudo.html?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw r.status;return r.text()})
.then(function(t){document.open();document.write(t);document.close()})
.catch(function(){document.getElementById('m').innerHTML='Não foi possível carregar o painel. <a style="color:#71b4ff" href="conteudo.html">Abrir direto</a>'});
</script></body></html>
